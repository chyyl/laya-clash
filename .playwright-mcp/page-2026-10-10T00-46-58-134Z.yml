- generic [active] [ref=f3e1]: "/** * Game - 鏍稿績娓告垙閫昏緫锛堝崟浜�/鑱旀満閫氱敤锛� * 涓栫晫妯℃嫙锛氬疄浣撱€佸湴鍥俱€佹垬鏂椼€佷换鍔°€佹帀钀� */ import { Entity } from './entity.js'; import { Player } from './player.js'; import { Monster } from './monster.js'; import { Map } from './map.js'; import { Combat } from './combat.js'; import { Quest } from './quest.js'; import { Equipment } from './equipment.js'; import { Talent } from './talent.js'; import { Faction } from './faction.js'; export class Game { constructor({ renderer, input, audio, storage, net, saveData }) { this.renderer = renderer; this.input = input; this.audio = audio; this.storage = storage; this.net = net; // 涓栫晫鐘舵€� this.world = { map: null, entities: new Map(), // id -> Entity players: new Map(), // id -> Player monsters: new Map(), // id -> Monster floaters: [], // 椋樺瓧 drops: [], // 鎺夎惤鐗� camera: { x: 0, y: 0 }, time: 0 }; // 绯荤粺妯″潡 this.combat = new Combat(this); this.quest = new Quest(this); this.equipment = new Equipment(this); this.talent = new Talent(this); this.faction = new Faction(this); // 娓告垙鐘舵€� this.state = 'menu'; // menu, playing, paused, dead this.factionChoice = null; this.playerId = null; // 缃戠粶 this.isHost = false; this.netPlayers = new Map(); // 缃戠粶鐜╁瀹炰綋 // 鎭㈠瀛樻。 if (saveData) this._restoreSave(saveData); } // 寮€濮嬫柊娓告垙 newGame(faction) { this.factionChoice = faction; this.state = 'playing'; // 鍒涘缓涓昏 this.playerId = 'player_' + Date.now(); const player = new Player(this.playerId, { faction, x: 0, y: 0, hp: 100, maxHp: 100, mp: 50, maxMp: 50, level: 1, exp: 0, stats: { str: 10, dex: 10, int: 10, vit: 10 }, skills: ['basic_attack', 'dash'] }); this.world.players.set(this.playerId, player); this.world.entities.set(this.playerId, player); // 鍔犺浇鍩庨晣鍦板浘 this.loadMap('town'); // 鍒濆浠诲姟 this.quest.initMainQuest(faction); // 鎾斁鍩庨晣闊充箰 this.audio.playMusic('town'); this._save(); } // 鎭㈠瀛樻。 _restoreSave(data) { this.factionChoice = data.faction; this.playerId = data.playerId; this.state = 'playing'; // 鎭㈠鐜╁ const player = new Player(this.playerId, data.player); this.world.players.set(this.playerId, player); this.world.entities.set(this.playerId, player); // 鎭㈠鍦板浘 this.loadMap(data.mapId, data.player.x, data.player.y); // 鎭㈠浠诲姟/瑁呭/澶╄祴 this.quest.restore(data.quests); this.equipment.restore(data.equipment); this.talent.restore(data.talents); this.audio.playMusic(data.mapId === 'town' ? 'town' : 'dungeon'); } // 鍔犺浇鍦板浘 async loadMap(mapId, spawnX = 0, spawnY = 0) { try { const response = await fetch(`js/content/maps/${mapId}.json`); const data = await response.json(); this.world.map = new Map(data); this.world.camera.x = spawnX; this.world.camera.y = spawnY; // 鐢熸垚鎬墿锛堥潪鍩庨晣锛� if (mapId !== 'town') this._spawnMonsters(mapId); console.log('[Game] Map loaded:', mapId); } catch (e) { console.error('[Game] Failed to load map:', mapId, e); // 鍒涘缓绌虹櫧鍦板浘鍏滃簳 this.world.map = new Map({ width: 50, height: 50, layers: [] }); } } _spawnMonsters(mapId) { const config = MONSTER_CONFIG[mapId] || MONSTER_CONFIG.default; const count = 8 + Math.floor(Math.random() * 6); for (let i = 0; i < count; i++) { const angle = Math.random() * Math.PI * 2; const dist = 200 + Math.random() * 400; const x = Math.cos(angle) * dist; const y = Math.sin(angle) * dist; const type = config.types[Math.floor(Math.random() * config.types.length)]; const id = `monster_${Date.now()}_${i}`; const monster = new Monster(id, { type, x, y, faction: this.factionChoice }); this.world.monsters.set(id, monster); this.world.entities.set(id, monster); } } // 涓绘洿鏂板惊鐜� update(dt) { if (this.state !== 'playing') return; this.world.time += dt; // 鐜╁杈撳叆 -> 鎰忓浘 const intent = this._getPlayerIntent(); // 鏇存柊鐜╁ for (const [id, player] of this.world.players) { player.update(dt, intent); this._clampToMap(player); } // 鏇存柊缃戠粶鐜╁锛堟彃鍊硷級 for (const [id, ent] of this.netPlayers) { ent.update(dt, { x: 0, y: 0, attack: false, skills: [] }); } // 鏇存柊鎬墿 AI for (const [id, monster] of this.world.monsters) { if (monster.hp <= 0) continue; monster.update(dt, this.world); this._clampToMap(monster); } // 鎴樻枟缁撶畻 this.combat.update(dt); // 鏇存柊椋樺瓧 this._updateFloaters(dt); // 鏇存柊鎺夎惤 this._updateDrops(dt); // 鐩告満璺熼殢涓昏 this._updateCamera(dt); // 缃戠粶锛氭埧涓诲箍鎾姸鎬� if (this.net.isHost) { this.net.queueState(this._getNetState()); } // 缃戠粶锛氳瀹㈠彂閫佽緭鍏� if (!this.net.isHost) { this.net.sendInput(intent); } // 鑷姩瀛樻。 this._autoSaveTimer = (this._autoSaveTimer || 0) + dt; if (this._autoSaveTimer > 10) { this._save(); this._autoSaveTimer = 0; } } _getPlayerIntent() { const axis = this.input.getAxis(); const mouseWorld = this.input.getMouseWorld(this.world.camera, this.renderer); return { move: axis, attack: this.input.down('attack') || this.input.consume('attack'), skills: [ this.input.consume('skill0'), this.input.consume('skill1'), this.input.consume('skill2'), this.input.consume('skill3') ], dash: this.input.consume('dash'), interact: this.input.consume('interact'), mouse: mouseWorld }; } _clampToMap(ent) { if (!this.world.map) return; const margin = 32; ent.x = Math.max(margin, Math.min(this.world.map.width * 64 - margin, ent.x)); ent.y = Math.max(margin, Math.min(this.world.map.height * 32 - margin, ent.y)); } _updateCamera(dt) { const player = this.world.players.get(this.playerId); if (!player) return; const targetX = player.x; const targetY = player.y; const lerp = 0.15; this.world.camera.x += (targetX - this.world.camera.x) * lerp; this.world.camera.y += (targetY - this.world.camera.y) * lerp; } _updateFloaters(dt) { for (let i = this.world.floaters.length - 1; i >= 0; i--) { const f = this.world.floaters[i]; f.life -= dt; f.y -= dt * 20; if (f.life <= 0) this.world.floaters.splice(i, 1); } } _updateDrops(dt) { for (let i = this.world.drops.length - 1; i >= 0; i--) { const d = this.world.drops[i]; d.life -= dt; d.bob = Math.sin(Date.now() / 200) * 3; if (d.life <= 0) this.world.drops.splice(i, 1); } } _getNetState() { return { players: [...this.world.players.values()].map(p => p.toNet()), monsters: [...this.world.monsters.values()].map(m => m.toNet()), floaters: this.world.floaters.slice(-10), time: this.world.time }; } applyNetState(state) { // 璁垮搴旂敤鎴夸富鐘舵€� for (const pData of state.players) { if (pData.id === this.playerId) continue; // 鑷繁鐢ㄦ湰鍦伴娴� let ent = this.netPlayers.get(pData.id); if (!ent) { ent = new Entity(pData.id); this.netPlayers.set(pData.id, ent); this.world.entities.set(pData.id, ent); } Object.assign(ent, pData); } for (const mData of state.monsters) { let ent = this.world.monsters.get(mData.id); if (!ent) { ent = new Monster(mData.id, { type: mData.type }); this.world.monsters.set(mData.id, ent); this.world.entities.set(mData.id, ent); } Object.assign(ent, mData); } this.world.floaters = state.floaters; } // 浼ゅ椋樺瓧 addFloater(x, y, text, color = '#ffd700', size = 16) { this.world.floaters.push({ x, y, text, color, size, life: 1.5, maxLife: 1.5 }); } // 鎺夎惤鐗� addDrop(x, y, item) { this.world.drops.push({ x, y, item, life: 60, bob: 0 }); } // 鎷惧彇妫€娴� checkPickup(player) { for (let i = this.world.drops.length - 1; i >= 0; i--) { const d = this.world.drops[i]; const dx = player.x - d.x; const dy = player.y - d.y; if (dx * dx + dy * dy < 2400) { // 48px this.equipment.addItem(d.item); this.audio.sfxPickup(); this.addFloater(d.x, d.y, `+${d.item.name}`, '#ffd700'); this.world.drops.splice(i, 1); } } } // 瀛樻。 _save() { const data = { faction: this.factionChoice, playerId: this.playerId, mapId: this.world.map?.id || 'town', player: this.world.players.get(this.playerId)?.toSave(), quests: this.quest.toSave(), equipment: this.equipment.toSave(), talents: this.talent.toSave(), playtime: (this._totalPlaytime || 0) + this.world.time }; this.storage.save(data); } // 鐜╁姝讳骸 onPlayerDeath() { this.state = 'dead'; this.audio.sfxKill(); // 3绉掑悗澶嶆椿鍩庨晣 setTimeout(() => this.reviveAtTown(), 3000); } reviveAtTown() { const player = this.world.players.get(this.playerId); player.hp = player.maxHp; player.x = 0; player.y = 0; this.loadMap('town'); this.state = 'playing'; this.audio.playMusic('town'); } } // 鎬墿閰嶇疆琛� const MONSTER_CONFIG = { default: { types: ['slime', 'goblin', 'skeleton'] }, forest: { types: ['slime', 'wolf', 'bandit', 'ent'] }, cave: { types: ['bat', 'skeleton', 'golem', 'spider'] }, ruins: { types: ['ghost', 'skeleton', 'cursed_knight', 'lich'] } };"
argin-top:12px\"></div> <button class=\"btn danger\" id=\"leave-room\" style=\"display:none\">绂诲紑鎴块棿</button> </div> `, { x: '50%', y: '50%', transform: 'translate(-50%, -50%)', width: '400px' }); // 璁剧疆/瀛樻。 this._createPanel('settings', '璁剧疆', ` <div style=\"display:flex;flex-direction:column;gap:16px\"> <label>闊抽噺: <input type=\"range\" id=\"vol-master\" min=\"0\" max=\"1\" step=\"0.1\" value=\"0.5\" style=\"width:200px\"></label> <label>闊充箰: <input type=\"range\" id=\"vol-music\" min=\"0\" max=\"1\" step=\"0.1\" value=\"0.3\" style=\"width:200px\"></label> <button class=\"btn\" id=\"export-save\">瀵煎嚭瀛樻。</button> <button class=\"btn\" id=\"import-save\">瀵煎叆瀛樻。</button> <input type=\"file\" id=\"import-file\" accept=\".json\" style=\"display:none\"> <button class=\"btn danger\" id=\"clear-save\">娓呯┖瀛樻。</button> <div style=\"color:#aaa;font-size:12px\">鐗堟湰: 0.1.0</div> </div> `, { x: '50%', y: '50%', transform: 'translate(-50%, -50%)', width: '320px' }); } _createPanel(id, title, content, style = {}) { const panel = document.createElement('div'); panel.className = 'panel hidden'; panel.id = `panel-${id}`; panel.style.cssText = Object.entries(style).map(([k,v]) => `${k}:${v}`).join(';'); panel.innerHTML = `<h3>${title}</h3><button class=\"btn\" style=\"position:absolute;top:8px;right:8px;padding:4px 8px;font-size:12px\" data-close=\"${id}\">脳</button>${content}`; this.root.appendChild(panel); this.elements[`panel${id.charAt(0).toUpperCase() + id.slice(1)}`] = panel; panel.querySelector('[data-close]').onclick = () => this.hidePanel(id); panel.querySelectorAll('.tab-btn').forEach(btn => { btn.onclick = () => this._switchTab(panel, btn.dataset.tab); }); } _switchTab(panel, tab) { panel.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab)); panel.querySelectorAll('.panel-content').forEach(c => c.classList.toggle('hidden', c.id !== `panel-${tab}`)); } showPanel(id) { const panel = this.elements[`panel${id.charAt(0).toUpperCase() + id.slice(1)}`]; if (panel) { panel.classList.remove('hidden'); this.visiblePanels.add(id); } } hidePanel(id) { const panel = this.elements[`panel${id.charAt(0).toUpperCase() + id.slice(1)}`]; if (panel) { panel.classList.add('hidden'); this.visiblePanels.delete(id); } } togglePanel(id) { const panel = this.elements[`panel${id.charAt(0).toUpperCase() + id.slice(1)}`]; if (panel.classList.contains('hidden')) this.showPanel(id); else this.hidePanel(id); } // ===== 闃佃惀閫夋嫨寮圭獥 ===== _createFactionModal() { const modal = document.createElement('div'); modal.className = 'modal-overlay hidden'; modal.id = 'faction-modal'; modal.innerHTML = ` <div class=\"faction-modal\"> <h2>閫夋嫨浣犵殑闃佃惀</h2> <p>杩欎釜閫夋嫨灏嗗喅瀹氫綘鐨勫垵濮嬭澶囥€佷富绾夸换鍔°€丯PC 鎬佸害鍜屼笓灞炲ぉ璧嬨€�<br>涓€鏃﹂€夋嫨鏃犳硶鏇存敼锛岃鎱庨噸鍐冲畾銆�</p> <div class=\"faction-choices\"> <button class=\"faction-btn kingdom\" data-faction=\"kingdom\"> <strong>鐜嬪浗姝ｇ粺鍐�</strong><br> <small>绉╁簭路鑽ｈ€€路瀹堟姢</small><br> 鍒濆锛氶搧鍓戙€佺毊鐢层€佺敓鍛借嵂姘疵�2<br> 涓撳睘锛氬姏閲�/浣撹川澶╄祴鍑忓厤 </button> <button class=\"faction-btn rebel\" data-faction=\"rebel\"> <strong>鍙嶆姉鍐�</strong><br> <small>鑷敱路鍙橀潻路甯屾湜</small><br> 鍒濆锛氶暱寮撱€佺柧椋庨澊銆佹硶鍔涜嵂姘�<br> 涓撳睘锛氭晱鎹�/鏅哄姏澶╄祴鍑忓厤 </button> </div> </div> `; this.root.appendChild(modal); this.elements.factionModal = modal; modal.querySelectorAll('.faction-btn').forEach(btn => { btn.onclick = () => this._onFactionSelect(btn.dataset.faction); }); } showFactionSelect(callback) { this._factionCallback = callback; this.elements.factionModal.classList.remove('hidden'); } _onFactionSelect(faction) { this.elements.factionModal.classList.add('hidden'); if (this._factionCallback) this._factionCallback(faction); } // ===== 鐑敭 ===== _bindHotkeys() { window.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; switch (e.key) { case 'i': case 'I': this.togglePanel('inventory'); break; case 'k': case 'K': this.togglePanel('talent'); break; case 'j': case 'J': this.togglePanel('quest'); break; case 'm': case 'M': this.togglePanel('multiplayer'); break; case 'Escape': this._closeAllPanels(); break; } }); } _closeAllPanels() { for (const id of this.visiblePanels) this.hidePanel(id); } // ===== 娓叉煋鏇存柊 ===== render(dt) { this._updateHUD(); this._updatePanels(); } _updateHUD() { const player = this.game.world.players.get(this.game.playerId); if (!player) return; // 琛€鏉� const hpPct = player.hp / player.maxHp; this.elements.hpFill.style.width = `${hpPct * 100}%`; this.elements.hpFill.style.background = hpPct > 0.3 ? 'linear-gradient(90deg, #ff4a4a, #ff8a4a)' : 'linear-gradient(90deg, #ff0000, #ff4a4a)'; this.elements.hpText.textContent = `${Math.ceil(player.hp)}/${player.maxHp}`; // 缁忛獙 this.elements.xpFill.style.width = `${(player.exp / player.expToNext) * 100}%`; // 绛夌骇/閲戝竵 this.elements.levelDisplay.textContent = `Lv.${player.level}`; this.elements.goldDisplay.textContent = `閲戝竵: ${player.gold}`; // 鎶€鑳芥爮 for (let i = 0; i < 4; i++) { const skillId = player.equippedSkills[i]; const slot = this.elements[`skillSlot${i}`]; const icon = this.elements[`skillIcon${i}`]; const cd = this.elements[`skillCd${i}`]; if (skillId) { const skill = SKILL_DATA[skillId]; icon.textContent = skill?.icon || '?'; const cdRemain = player.skillCooldowns[skillId] || 0; if (cdRemain > 0) { cd.textContent = Math.ceil(cdRemain); cd.classList.remove('hidden'); } else { cd.classList.add('hidden'); } } else { icon.textContent = '?'; cd.classList.add('hidden'); } } } _updatePanels() { if (this.visiblePanels.has('inventory')) this._renderInventory(); if (this.visiblePanels.has('talent')) this._renderTalent(); if (this.visiblePanels.has('quest')) this._renderQuest(); if (this.visiblePanels.has('multiplayer')) this._renderMultiplayer(); } // ===== 鑳屽寘娓叉煋 ===== _renderInventory() { const player = this.game.world.players.get(this.game.playerId); const equip = this.elements['inv-equip']; const bag = this.elements['inv-bag']; const shop = this.elements['inv-shop']; // 瑁呭鏍� equip.innerHTML = ''; const slots = ['weapon', 'armor', 'helmet', 'gloves', 'boots', 'accessory']; const slotNames = { weapon: '姝﹀櫒', armor: '闃插叿', helmet: '澶寸洈', gloves: '鎵嬪', boots: '闈村瓙', accessory: '楗板搧' }; for (const slot of slots) { const item = player.equipment[slot]; const div = document.createElement('div'); div.className = 'item-slot' + (item ? ' filled' : ''); div.style.cssText = 'display:inline-block;width:64px;height:64px;border:2px solid #4a4a6a;border-radius:6px;margin:4px;background:#1a1a3a;position:relative;cursor:pointer'; div.dataset.slot = slot; div.innerHTML = item ? ` <div style=\"font-size:28px;text-align:center;line-height:64px\">${item.icon || '鉂�'}</div> <div style=\"position:absolute;bottom:2px;right:4px;font-size:9px;color:${ITEM_RARITY_COLOR[item.rarity]}\">${item.rarity[0].toUpperCase()}</div> ` : `<div style=\"text-align:center;line-height:64px;color:#666;font-size:11px\">${slotNames[slot]}</div>`; div.onclick = () => item ? this._showItemTooltip(item, div) : null; div.ondblclick = () => item ? this.game.equipment.unequip(slot) : null; equip.appendChild(div); } // 鑳屽寘缃戞牸 bag.innerHTML = ''; const maxSlots = this.game.equipment.maxSlots; for (let i = 0; i < maxSlots; i++) { const item = this.game.equipment.inventory[i]; const div = document.createElement('div'); div.className = 'item-slot' + (item ? ' filled' : ''); div.style.cssText = 'display:inline-block;width:56px;height:56px;border:2px solid #4a4a6a;border-radius:6px;margin:2px;background:#1a1a3a;position:relative;cursor:pointer'; div.innerHTML = item ? ` <div style=\"font-size:24px;text-align:center;line-height:56px\">${item.icon || '鉂�'}</div> <div style=\"position:absolute;bottom:2px;right:4px;font-size:9px;color:${ITEM_RARITY_COLOR[item.rarity]}\">${item.rarity[0].toUpperCase()}</div> <div style=\"position:absolute;top:2px;left:2px;font-size:9px;color:#aaa\">${i+1}</div> ` : ''; if (item) { div.onclick = () => this._showItemTooltip(item, div); div.ondblclick = () => this._equipFromBag(i); } else { div.onclick = () => {}; } bag.appendChild(div); } // 鍟嗗簵锛堢畝鍗曠ず渚嬶級 shop.innerHTML = '<div style=\"color:#aaa;text-align:center;padding:20px\">鍟嗗簵鍔熻兘寮€鍙戜腑...</div>'; } _equipFromBag(index) { const item = this.game.equipment.inventory[index]; if (!item) return; this.game.equipment.equip(item, item.slot); } _showItemTooltip(item, anchor) { // 绠€鍗� tooltip const old = document.getElementById('item-tooltip'); if (old) old.remove(); const stats = this.game.equipment.getTotalStats(item); const lines = [ `<strong style=\"color:${ITEM_RARITY_COLOR[item.rarity]}\">${item.name}</strong>`, `<small>${ITEM_TYPE_NAME[item.type] || item.type}</small>`, '---', ...Object.entries(stats).map(([k,v]) => `${STAT_NAME[k] || k}: +${v}`) ]; if (item.description) lines.push('---', `<small>${item.description}</small>`); const tooltip = document.createElement('div'); tooltip.id = 'item-tooltip'; tooltip.style.cssText = `position:fixed;background:#2a2a4a;border:2px solid ${ITEM_RARITY_COLOR[item.rarity]};border-radius:6px;padding:12px;min-width:200px;z-index:1000;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.5)`; tooltip.innerHTML = lines.join('<br>'); document.body.appendChild(tooltip); const rect = anchor.getBoundingClientRect(); tooltip.style.left = `${rect.right + 8}px`; tooltip.style.top = `${rect.top}px`; setTimeout(() => { if (tooltip.parentNode) tooltip.remove(); }, 3000); } refreshInventory() { if (this.visiblePanels.has('inventory')) this._renderInventory(); } // ===== 澶╄祴鏍戞覆鏌� ===== _renderTalent() { const canvas = document.getElementById('talent-canvas'); if (!canvas) return; const ctx = canvas.getContext('2d'); const data = this.game.talent.getTreeData(); this.elements.talentPoints.textContent = `澶╄祴鐐�: ${data.points}`; ctx.clearRect(0, 0, canvas.width, canvas.height); // 杩炵嚎 ctx.strokeStyle = '#3a3a5a'; ctx.lineWidth = 2; for (const node of data.nodes) { if (node.requires) { for (const req of node.requires) { const rNode = data.nodes.find(n => n.id === req); if (rNode) { const x1 = 80 + node.pos.x 
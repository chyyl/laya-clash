play\">Lv.1</div><div id=\"gold-display\">閲戝竵: 0</div>'; this.root.appendChild(info); this.elements.levelDisplay = info.querySelector('#level-display'); this.elements.goldDisplay = info.querySelector('#gold-display'); // 鏃ュ織闈㈡澘 const log = document.createElement('div'); log.className = 'log-panel'; log.id = 'log-panel'; this.root.appendChild(log); this.elements.logPanel = log; } _createTouchControls() { // 铏氭嫙鎽囨潌 const stick = document.createElement('div'); stick.className = 'vstick'; stick.innerHTML = '<div class=\"vstick-base\"></div><div class=\"vstick-knob\"></div>'; this.root.appendChild(stick); this.elements.vstick = stick; // 瑙﹀睆鎸夐挳 const touchBtns = document.createElement('div'); touchBtns.className = 'touch-btns'; const actions = ['attack', 'skill0', 'skill1', 'skill2']; const icons = ['鈿旓笍', '鉁�', '馃敭', '鈿�']; actions.forEach((a, i) => { const btn = document.createElement('div'); btn.className = 'touch-btn'; btn.dataset.action = a; btn.textContent = icons[i]; touchBtns.appendChild(btn); }); this.root.appendChild(touchBtns); this.elements.touchBtns = touchBtns; // 绉诲姩绔樉绀猴紝妗岄潰绔殣钘� const isTouch = 'ontouchstart' in window; stick.style.display = isTouch ? 'block' : 'none'; touchBtns.style.display = isTouch ? 'flex' : 'none'; } // ===== 闈㈡澘绯荤粺 ===== _createPanels() { // 鑳屽寘 this._createPanel('inventory', '鑳屽寘', ` <div class=\"panel-tabs\"> <button class=\"tab-btn active\" data-tab=\"equip\">瑁呭</button> <button class=\"tab-btn\" data-tab=\"bag\">鑳屽寘</button> <button class=\"tab-btn\" data-tab=\"shop\">鍟嗗簵</button> </div> <div class=\"panel-content\" id=\"inv-equip\"></div> <div class=\"panel-content hidden\" id=\"inv-bag\"></div> <div class=\"panel-content hidden\" id=\"inv-shop\"></div> `, { x: '50%', y: '50%', transform: 'translate(-50%, -50%)', width: '520px', maxHeight: '70vh' }); // 澶╄祴 this._createPanel('talent', '澶╄祴鏍�', ` <div style=\"display:flex;gap:8px;margin-bottom:12px;justify-content:center\"> <span id=\"talent-points\" style=\"color:#ffd700\">澶